<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;background:#0b0c0f;overflow:hidden;
 font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif}
.stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;width:120vmin;height:120vmin;border-radius:50%;
 background:radial-gradient(circle,rgba(254,80,0,.42) 0%,rgba(254,80,0,.12) 42%,transparent 68%);
 animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.78);opacity:.55}50%{transform:scale(1.1);opacity:1}}
.vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 42%,transparent 38%,rgba(0,0,0,.72) 100%)}
.ring{position:relative;width:42vmin;height:42vmin}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:rgba(255,255,255,.07);stroke-width:2}
.rf{fill:none;stroke:url(#gr);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:392;stroke-dashoffset:392}
@keyframes draw{to{stroke-dashoffset:0}}
.core{position:absolute;inset:0;display:grid;place-items:center}
.core i{width:10vmin;height:10vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd88a,#ff8a3d 55%,#fe5000);
 box-shadow:0 0 9vmin 2vmin rgba(254,80,0,.5);animation:core 2.2s ease-in-out infinite}
@keyframes core{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.steam{position:absolute;inset:0}
.steam i{position:absolute;bottom:44vmin;width:2.2vmin;height:2.2vmin;border-radius:50%;
 background:rgba(255,200,87,.55);filter:blur(.8vmin);opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}
 25%{opacity:.75}100%{transform:translateY(-40vmin) scale(1.5);opacity:0}}
.word{position:relative;margin-top:6vmin;display:flex;gap:.5vmin;font-size:10vmin;font-weight:800;letter-spacing:.6vmin;color:#fff}
.word span{opacity:0;transform:translateY(3vmin) scale(.6);text-shadow:0 1.5vmin 5vmin rgba(254,80,0,.6)}
@keyframes pop{0%{opacity:0;transform:translateY(3vmin) scale(.6)}
 70%{opacity:1;transform:translateY(-.8vmin) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
.sub{position:relative;margin-top:2.2vmin;font-size:2.9vmin;font-weight:700;letter-spacing:1.5vmin;color:#ff8a3d;opacity:0}
.tag{position:relative;margin-top:2.4vmin;font-size:2.5vmin;letter-spacing:.7vmin;color:#8b93a1;opacity:0}
@keyframes fade{to{opacity:1}}
.bar{position:absolute;bottom:16vmin;width:58vmin;height:.7vmin;border-radius:1vmin;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:1vmin;
 background:linear-gradient(90deg,#fe5000,#ffc857)}
@keyframes load{to{width:100%}}
.skip{position:absolute;bottom:6vmin;font-size:2.6vmin;color:#5f6673;letter-spacing:.5vmin;opacity:0}
</style></head><body>
<div class="stage">
 <div class="glow"></div><div class="vig"></div>
 <div class="steam" id="steam"></div>
 <div class="ring">
  <svg viewBox="0 0 120 120"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#fe5000"/><stop offset="1" stop-color="#ffc857"/></linearGradient></defs>
   <circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" cx="60" cy="60" r="52"/></svg>
  <div class="core"><i></i></div>
 </div>
 <div class="word" id="word"></div>
 <div class="sub" id="sub">FARFOR · УЧЁТ СМЕН</div>
 <div class="tag" id="tag">смены · часы · зарплата</div>
 <div class="bar"><i id="barfill"></i></div>
 <div class="skip" id="skip">пропустить</div>
</div>
<script>
const word=document.getElementById('word');
'СМЕНА'.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c;word.appendChild(s);});
const st=document.getElementById('steam');
for(let i=0;i<10;i++){const p=document.createElement('i');
 p.style.left=(20+i*7)+'%'; p.style.animation=`rise 3.4s ease-in-out ${0.6+i*0.2}s infinite`; st.appendChild(p);}
document.querySelectorAll('#word span').forEach((s,i)=>{s.style.animation=`pop .62s cubic-bezier(.2,1.4,.4,1) ${0.45+i*0.12}s both`;});
document.querySelector('.rf').style.animation='draw 1.35s cubic-bezier(.35,0,.2,1) .1s both';
document.getElementById('sub').style.animation='fade .7s ease 1.25s both';
document.getElementById('tag').style.animation='fade .7s ease 1.9s both';
document.getElementById('skip').style.animation='fade .7s ease 2.6s both';
document.getElementById('barfill').style.animation='load 3.6s cubic-bezier(.3,.8,.4,1) .25s both';
</script></body></html>
